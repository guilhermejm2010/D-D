                <div id="dnd-sub">
                    <h2>
                        <!-- Dungeons and Dragons ou D&D é o maior e o primeiro RPG (jogo de interpretação de papéis) comercializado
                no mundo , funcionando
                como uma narrativa colaborativa onde os participantes criam uma história juntos. Em uma sessão típica, a
                maioria das pessoas joga como heróis em um mundo de fantasia medieval, controlando as ações,
                personalidades e decisões de seus próprios personagens. Um dos participantes assume o papel de Mestre do
                Jogo, atuando como o narrador que descreve os cenários, controla as criaturas adversárias e decide como
                
                o ambiente reage às escolhas do grupo. Para determinar se uma ação difícil ou arriscada dá certo. -->
